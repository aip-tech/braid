<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>braid</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<div id="topnav">
			<div class="topnav-inner">
				<span class="brand">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="4.5" cy="19.5" r="2.5"/><circle cx="19.5" cy="4.5" r="2.5"/><path d="M6.5 17.5 17.5 6.5"/><path d="M8.5 6.5h2a2 2 0 0 1 2 2v7"/></svg>
					<span>braid</span>
				</span>
				<span class="topnav-version" id="braid-version"></span>
			</div>
		</div>
		<main>
			<p id="error" class="error" hidden></p>
			<div id="view-table">
				<table id="processes">
					<thead>
						<tr>
							<th>Name</th>
							<th>PID</th>
							<th>Status</th>
							<th>Started</th>
							<th></th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
			<div id="view-detail" hidden>
				<p class="detail-back"><a href="#/">&larr; All processes</a></p>
				<div class="detail-toolbar">
					<div class="detail-heading">
						<h1 id="detail-name">Process</h1>
						<span id="detail-status" class="detail-status"></span>
					</div>
					<div class="detail-meta">
						<span>PID <span id="detail-pid"></span></span>
						<span>Started <span id="detail-started"></span></span>
					</div>
					<div class="detail-actions">
						<button id="detail-stop" type="button">Stop</button>
						<button id="detail-restart" type="button">Restart</button>
					</div>
				</div>
				<p id="detail-error" class="row-error" hidden></p>
				<p id="detail-log-status" class="error" hidden></p>
				<div id="detail-log" class="log-pane">
					<div id="detail-log-inner" class="log-pane-inner"></div>
				</div>
			</div>
		</main>
		<script type="module" src="./src/main.ts"></script>
	</body>
</html>
