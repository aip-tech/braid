name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/example's typecheck resolves @aip-tech/braid's types from packages/braid/dist,
      # so the build has to run before typecheck, not just before publish.
      - run: pnpm build

      - run: pnpm typecheck

      # Read-only, unlike the root `check` script (which uses --write for local dev auto-fix) -
      # CI should fail on formatting/lint issues, not silently fix and pass them.
      - run: npx biome check .

      - run: pnpm test
